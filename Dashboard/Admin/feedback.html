<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | CampusConnect</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="feedback.css">
</head>

<body>

<header class="page-header">

    <button id="backBtn" class="icon-btn">
        <i class="fa-solid fa-arrow-left"></i>
    </button>

    <h1>Feedback</h1>

    <button id="refreshBtn" class="icon-btn">
        <i class="fa-solid fa-arrows-rotate"></i>
    </button>

</header>

<main class="page">

    <section class="intro">

        <div>
            <span class="eyebrow">Student Voice</span>
            <h2>Feedback Management</h2>
            <p>
                Review student feedback and manage feedback requests.
            </p>
        </div>

        <button id="createFeedbackBtn" class="primary-btn">
            <i class="fa-solid fa-plus"></i>
            Create Feedback Request
        </button>

    </section>

    <section class="actions">

        <button class="action-card" data-view="responses">
            <span class="icon blue">
                <i class="fa-solid fa-comments"></i>
            </span>

            <span>
                <strong>Feedback Responses</strong>
                <small>Review submitted feedback</small>
            </span>

            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="action-card" data-view="requests">
            <span class="icon green">
                <i class="fa-solid fa-paper-plane"></i>
            </span>

            <span>
                <strong>Feedback Requests</strong>
                <small>Manage feedback forms</small>
            </span>

            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button class="action-card" data-view="issues">
            <span class="icon orange">
                <i class="fa-solid fa-flag"></i>
            </span>

            <span>
                <strong>Flagged Feedback</strong>
                <small>Review feedback requiring attention</small>
            </span>

            <i class="fa-solid fa-chevron-right"></i>
        </button>

    </section>

    <section id="workspace" class="workspace" hidden>

        <div class="workspace-head">

            <div>
                <span id="viewLabel" class="eyebrow">
                    Feedback
                </span>

                <h2 id="viewTitle">
                    Feedback Records
                </h2>

                <p id="viewDescription"></p>
            </div>

            <button id="closeWorkspaceBtn" class="secondary-btn">
                <i class="fa-solid fa-xmark"></i>
                Close
            </button>

        </div>

        <div class="toolbar">

            <div class="search">
                <i class="fa-solid fa-magnifying-glass"></i>

                <input id="searchInput"
                       type="search"
                       placeholder="Search feedback...">
            </div>

            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="open">Open</option>
                <option value="reviewed">Reviewed</option>
                <option value="resolved">Resolved</option>
            </select>

            <button id="exportBtn" class="secondary-btn">
                <i class="fa-solid fa-download"></i>
                Export
            </button>

        </div>

        <div class="feedback-list" id="feedbackList"></div>

        <div id="emptyState" class="empty">
            <i class="fa-regular fa-comment-dots"></i>
            <h3>No feedback records</h3>
            <p>
                Feedback data will appear when it is available
                from the backend.
            </p>
        </div>

    </section>

</main>

<div id="feedbackModal" class="modal" hidden>

    <div class="modal-box">

        <div class="modal-head">

            <h2>Create Feedback Request</h2>

            <button id="closeFeedbackModal" class="close-btn">
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

        <form id="feedbackForm">

            <label>
                Feedback Title
                <input id="feedbackTitle" required>
            </label>

            <label>
                Target Audience
                <select id="feedbackAudience">
                    <option value="students">Students</option>
                    <option value="faculty">Faculty</option>
                    <option value="all">All</option>
                </select>
            </label>

            <label>
                Deadline
                <input id="feedbackDeadline" type="date">
            </label>

            <label>
                Description
                <textarea id="feedbackDescription"></textarea>
            </label>

            <div class="modal-actions">

                <button type="button"
                        id="cancelFeedbackBtn"
                        class="secondary-btn">
                    Cancel
                </button>

                <button class="primary-btn">
                    Create Request
                </button>

            </div>

        </form>

    </div>

</div>

<script src="feedback.js"></script>
</body>
</html>
